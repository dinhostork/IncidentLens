[project]
name = "catalog"
version = "0.1.0"
description = "Demo catalog service: product listing backed by Postgres with a Redis cache."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "openfeature-provider-flagd>=0.6.1",
    "openfeature-sdk>=0.10.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "redis>=8.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
catalog = "catalog.main:main"

[dependency-groups]
dev = [
  "httpx2>=2.16.2",
  "pytest>=9",
  "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
