version: "2"

run:
  go: "1.23"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: indent-error-flow
        - name: unused-parameter

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dinhostork/IncidentLens
