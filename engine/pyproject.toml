[project]
name = "incidentlens"
version = "0.0.1"
description = "Reconstruct production incidents from telemetry and change events."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
incidentlens = "incidentlens.cli:main"

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
