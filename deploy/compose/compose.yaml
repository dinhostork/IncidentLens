name: incidentlens

# Local stack: Collector -> ClickHouse, flagd for fault flags, the demo system
# (gateway, catalog, orders, payments, with Postgres and Redis) and a k6 load
# generator sending baseline traffic to the gateway.
# Run from the repo root with `make up`, or:
#   docker compose -f deploy/compose/compose.yaml up -d --build --wait
#
# The Collector, flagd and Go service images have no shell or HTTP client, so
# their health checks run a static busybox copied into a shared volume by the
# `probe` service.
#
# flagd serves deploy/flags/active.json, the fault flags currently in effect.
# `make up` creates it from flags.json (all faults off); without make, run
# `uv run demo/faults.py init` first.

# Settings shared by the demo services. See docs/telemetry-conventions.md.
x-demo-env: &demo-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=demo,service.namespace=shop
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  # Fault flags, synced from flagd's sync service (port 8015).
  FLAGD_HOST: flagd

x-demo-service: &demo-service
  restart: unless-stopped
  # Services get 5s to finish requests and 3s to flush telemetry on SIGTERM.
  stop_grace_period: 15s
  volumes:
    - probe:/probe:ro
  healthcheck:
    test: ["CMD", "/probe/busybox", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s
  deploy:
    resources:
      limits:
        memory: 128m

services:
  probe:
    image: busybox:1.37.0-musl
    command: ["cp", "/bin/busybox", "/probe/busybox"]
    volumes:
      - probe:/probe
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.48.11
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-incidentlens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-incidentlens}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ports:
      - "127.0.0.1:8123:8123" # HTTP
      - "127.0.0.1:9000:9000" # native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Creates IncidentLens's own tables from deploy/clickhouse/init/*.sql, in
  # file name order. Runs on every `make up`; the statements are idempotent.
  clickhouse-init:
    image: clickhouse/clickhouse-server:26.8.48.11
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /init/*.sql; do
          echo "applying $${f##*/}"
          clickhouse-client --host clickhouse --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --queries-file "$$f"
        done
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-incidentlens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-incidentlens}
    volumes:
      - ../clickhouse/init:/init:ro
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      clickhouse:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - probe:/probe:ro
      - ../otel:/etc/otelcol:ro
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-incidentlens}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-incidentlens}
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      probe:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      # Not needed by the Collector itself. Something has to depend on the
      # one-shot init service, or `up --wait` fails when it exits.
      clickhouse-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-qO-", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  flagd:
    image: ghcr.io/open-feature/flagd:v0.18.2
    command: ["start", "--uri", "file:/etc/flagd/active.json"]
    volumes:
      - probe:/probe:ro
      - ../flags:/etc/flagd:ro
    ports:
      - "127.0.0.1:8013:8013" # flag evaluation (gRPC)
      - "127.0.0.1:8016:8016" # OFREP (HTTP)
    deploy:
      resources:
        limits:
          memory: 128m
    depends_on:
      probe:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-qO-", "http://127.0.0.1:8014/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.12.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    <<: *demo-service
    build:
      context: ../../demo
      dockerfile: services/gateway/Dockerfile
    image: incidentlens-demo/gateway:dev
    environment:
      <<: *demo-env
      OTEL_SERVICE_NAME: gateway
      SERVICE_VERSION: ${GATEWAY_VERSION:-1.0.0}
      CATALOG_URL: http://catalog:8080
      ORDERS_URL: http://orders:8080
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      probe:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
      flagd:
        condition: service_healthy
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy

  catalog:
    <<: *demo-service
    build:
      context: ../../demo
      dockerfile: services/catalog/Dockerfile
    image: incidentlens-demo/catalog:dev
    environment:
      <<: *demo-env
      OTEL_SERVICE_NAME: catalog
      SERVICE_VERSION: ${CATALOG_VERSION:-1.0.0}
      DATABASE_URL: postgres://catalog:catalog@postgres:5432/catalog
      REDIS_URL: redis://redis:6379/0
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      probe:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
      flagd:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  orders:
    <<: *demo-service
    build:
      context: ../../demo
      dockerfile: services/orders/Dockerfile
    image: incidentlens-demo/orders:dev
    environment:
      <<: *demo-env
      OTEL_SERVICE_NAME: orders
      SERVICE_VERSION: ${ORDERS_VERSION:-1.0.0}
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders
      CATALOG_URL: http://catalog:8080
      PAYMENTS_URL: http://payments:8080
    depends_on:
      probe:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
      flagd:
        condition: service_healthy
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy
      payments:
        condition: service_healthy

  payments:
    <<: *demo-service
    build:
      context: ../../demo
      dockerfile: services/payments/Dockerfile
    image: incidentlens-demo/payments:dev
    environment:
      <<: *demo-env
      OTEL_SERVICE_NAME: payments
      SERVICE_VERSION: ${PAYMENTS_VERSION:-1.0.0}
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments
    depends_on:
      probe:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
      flagd:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Baseline traffic through the gateway, see demo/loadgen/README.md. k6's own
  # metrics are not exported anywhere.
  loadgen:
    image: grafana/k6:2.4.0
    command: ["run", "--quiet", "--no-color", "--summary-mode=disabled", "/loadgen/script.js"]
    environment:
      K6_NO_USAGE_REPORT: "true"
      GATEWAY_URL: http://gateway:8080
      LOADGEN_RPS: ${LOADGEN_RPS:-20}
      LOADGEN_WAVE_MINUTES: ${LOADGEN_WAVE_MINUTES:-60}
      LOADGEN_WAVE_AMPLITUDE: ${LOADGEN_WAVE_AMPLITUDE:-0.2}
      LOADGEN_JITTER: ${LOADGEN_JITTER:-0.1}
    volumes:
      - ../../demo/loadgen:/loadgen:ro
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      gateway:
        condition: service_healthy

  # Sends a few test spans to the Collector. Used by `make smoke`.
  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.165.1
    profiles: ["smoke"]
    command:
      - traces
      - --otlp-endpoint=otel-collector:4317
      - --otlp-insecure
      - --service=smoke-test
      - --traces=10
      - --child-spans=2
    depends_on:
      otel-collector:
        condition: service_healthy

volumes:
  clickhouse-data:
  postgres-data:
  probe:
